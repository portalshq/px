name: publish-px-core

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-core:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo publish -p portalshq-px --dry-run
      # Publish via crates.io Trusted Publishing (OIDC): no API token.
      # Requires a trusted publisher on crates.io for crate `portalshq-px`
      # pointing at portalshq/px + this workflow file (+ production env).
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p portalshq-px
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-cli:
    needs: publish-core
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo publish -p portalshq-px-cli --dry-run
      # Requires a trusted publisher on crates.io for crate `portalshq-px-cli`
      # pointing at portalshq/px + this workflow file (+ production env).
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p portalshq-px-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
