name: publish-px-typescript

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install target
        run: rustup target add ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: npm ci
        working-directory: typescript/px-sdk

      - run: npx napi build --cargo-cwd . --platform --release --target ${{ matrix.target }}
        working-directory: typescript/px-sdk

      - uses: actions/upload-artifact@v4
        with:
          name: napi-px-${{ matrix.target }}
          path: typescript/px-sdk/*.node

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires npm >= 11.5.1; the npm bundled with
      # Node may be older, so upgrade explicitly (see npm/cli#9088).
      - run: npm install -g npm@^11

      - run: npm ci
        working-directory: typescript/px-sdk

      - uses: actions/download-artifact@v4
        with:
          pattern: napi-px-*
          path: typescript/px-sdk/
          merge-multiple: true

      # napi-rs generates index.js alongside the native binary. The package's
      # ESM wrapper loads this CommonJS loader, so generate and retain it in
      # the publish workspace even though the platform binaries came from the
      # build matrix above.
      - run: npm run build:native
        working-directory: typescript/px-sdk

      - run: npm run build:types
        working-directory: typescript/px-sdk

      - run: |
          ls -la *.node index.cjs
          npm pack --dry-run --json | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => input += chunk);
            process.stdin.on("end", () => {
              const [{ files = [] }] = Object.values(JSON.parse(input));
              if (!files.some(({ path }) => path === "index.cjs")) {
                throw new Error("npm package is missing index.cjs");
              }
            });
          '
        working-directory: typescript/px-sdk

      # Publish via npm Trusted Publishing (OIDC): no NODE_AUTH_TOKEN.
      # Requires a trusted publisher on npmjs.com for @portalshq/px
      # pointing at portalshq/px + this workflow file (+ production env).
      - run: npm publish --access public
        working-directory: typescript/px-sdk
