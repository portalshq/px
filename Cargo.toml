[workspace]
resolver = "2"
members = [
    "crates/px-core",
    "crates/px-cli",
    "crates/px-mcp-server",
    "crates/px-docgen",
    "crates/px-server",
    "crates/px-test-utils",
    "crates/narrativeengine",
    "python/px-sdk",
    "python/narrativeengine",
    "typescript/px-sdk",
]

[workspace.package]
version = "0.9.2"
edition = "2024"
license = "MIT"
authors = ["Cinematic Canvas <team@cinematiccanvas.com>"]

[workspace.dependencies]
px-core = { package = "portalshq-px", version = "0.9", path = "crates/px-core" }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
schemars = "0.8"
once_cell = "1"

# Hashing / Crypto
blake3 = "1.5"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
hex = "0.4"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# HTTP server
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Identifiers
ulid = { version = "1", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Bytes and object storage
bytes = "1"
object_store = "0.11"
zstd-sys = "2"

# Async traits
async-trait = "0.1"

# Thread pool
threadpool = "1.8"

# gRPC
tonic = { version = "0.12", default-features = false }
prost = "0.13"

# JSON Schema validation
jsonschema = "0.30"

# Diff
similar = "2"

# NAPI bindings (TypeScript SDK)
napi = { version = "2.16", default-features = false, features = ["napi4"] }
napi-derive = "2.16"
napi-build = "2.3"

# Python bindings
pyo3 = { version = "0.22" }

# Testing
proptest = "1.5"
rstest = "0.23"
tempfile = "3"

# Random
rand = "0.9"

# Encoding
base64 = "0.22"
